[build]
builder = "dockerfile"

[deploy]
healthcheckPath = "/healthz"
# A fresh Discord-enabled volume installs the external plugin before gateway
# readiness. Keep this aligned with the bounded local cold-start gate.
healthcheckTimeout = 600
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[mounts]]
source = "openclaw_data"
destination = "/data"
